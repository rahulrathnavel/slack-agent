<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">PioltPPT sample slide image</title>
  <desc id="desc">A clean editable sample image used when a slide asks for an image without a provided URL.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4f1"/>
      <stop offset="0.52" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#d9e7ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087f5b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect x="96" y="86" width="1008" height="628" rx="28" fill="#ffffff" opacity="0.72"/>
  <circle cx="944" cy="218" r="84" fill="#f2c94c" opacity="0.82"/>
  <path d="M90 618 C230 522 358 548 486 456 C622 356 748 400 892 306 C984 246 1082 230 1200 188 L1200 800 L90 800 Z" fill="#0f766e" opacity="0.88"/>
  <path d="M0 692 C142 636 280 674 414 586 C566 486 728 514 890 416 C1010 344 1118 332 1200 286 L1200 800 L0 800 Z" fill="#111827" opacity="0.78"/>
  <rect x="96" y="680" width="1008" height="12" fill="url(#bar)"/>
  <g fill="#111827">
    <text x="126" y="150" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Sample open image</text>
    <text x="126" y="196" font-family="Inter, Arial, sans-serif" font-size="24">Replace this src URL in Deck Playground.</text>
  </g>
</svg>
